services:
  nginx_gateway:
    build:
      context: .  # Build dari folder nginx/
      dockerfile: Dockerfile
    image: grpc-nginx-proxy:latest
    container_name: grpc-nginx
    ports:
      - "80:80"
      - "443:443"
      - "50001:50001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: app-network
