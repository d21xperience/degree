events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log;

  client_max_body_size 20M;
  
  # Upstream blocks (optional, untuk load balancing future)
  # upstream auth_services {
  #     server auth_service:8182;
  # }
  # HTTP Server - Redirect to HTTPS
  server {
    listen 80;
    server_name localhost;
    
    # Redirect semua request ke HTTPS
    return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server-key.pem;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Static assets
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Frontend Sakai-Vue
    location / {
      # proxy_pass http://sakai-vue:3000;
      proxy_pass         http://host.docker.internal:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Tambahkan untuk development
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;
    }
    # Auth Service
    location /api/v1/as/ {
      # proxy_pass         http://auth_service:8182/api/v1/as/;
      proxy_pass         http://host.docker.internal:8182/api/v1/as/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Cookie $http_cookie;

      # CORS headers
      add_header Access-Control-Allow-Origin "https://localhost" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    
    # Handle preflight
    if ($request_method = 'OPTIONS') {
        return 204;
    }
    }

    # Sekolah Service
    location /api/v1/ss/ {
      # proxy_pass http://sekolah_service:8183/api/v1/ss/;
      proxy_pass  http://host.docker.internal:8183/api/v1/ss/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
            # CORS headers
      add_header Access-Control-Allow-Origin "https://localhost" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    
      # Handle preflight
      if ($request_method = 'OPTIONS') {
          return 204;
      }
    }

    # # Smart Contract Service
    # location /api/v1/scs/ {
    #   proxy_pass http://sc_service:8184/api/v1/scs/;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    #   proxy_set_header Cookie $http_cookie;
    # }
  }

  # gRPC Server
  # server {
  #     listen 50001 ssl;
  #     http2 on;
  #     server_name localhost;

  #     ssl_certificate     /etc/nginx/certs/server.pem;
  #     ssl_certificate_key /etc/nginx/certs/server-key.pem;
  #     ssl_session_cache shared:SSL:1m;
  #     ssl_session_timeout 10m;
  #     ssl_prefer_server_ciphers on;
  #     ssl_protocols       TLSv1.2 TLSv1.3;
  #     ssl_ciphers         HIGH:!aNULL:!MD5;

  #     location /api/v1/as/ {
  #         grpc_pass grpc://auth_service:50051;
  #         grpc_set_header Host $host;
  #     }

  #     add_header X-Content-Type-Options nosniff;
  #     add_header X-Frame-Options "SAMEORIGIN";
  # }
}