services:
    # Frontend Vue.js
    sakai-vue:
        build: .
        image: sc-frontend_service:1.0.0
        container_name: sakai-vue
        environment:
            - CHOKIDAR_USEPOLLING=true
            - VITE_API_BASE_URL=${VITE_API_BASE_URL} 
        ports:
            - '3000:3000'
        volumes:
            # Mount hanya source code, bukan seluruh directory
            - ./src:/app/src
            - ./public:/app/public
            - ./vite.config.mjs:/app/vite.config.mjs
        command: npm run dev
        networks:
            - app-network

networks:
    app-network:
        external: true
        name: app-network